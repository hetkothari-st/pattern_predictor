[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-pattern-intelligence"
version = "0.1.0"
description = "Real-time chart pattern detection and trading guidance."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "pyyaml>=6.0",
  "sqlmodel>=0.0.16",
  "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "scikit-learn>=1.4",
]
knowledge = [
  "pdfplumber>=0.11",
  "chromadb>=0.5",
  "sentence-transformers>=2.7",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
